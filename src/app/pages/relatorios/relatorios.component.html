<div class="internacoes">
  <app-side-bar class="sidebar"></app-side-bar>
  <div class="main">
    <h1>Relatórios</h1>
    <div class="container-cards">
      <div class="card">
        <form class="vertical-form">
          <h2>Relatório de internações</h2>
          <div class="inputs-container">
            <div class="form-group">
              <label class="label" for="atendimento">Atendimento</label>
              <input type="text" id="atendimento" name="atendimento" class="form-control">
            </div>
            <div class="form-group">
              <label class="label" for="nomePaciente">Nome do Paciente</label>
              <input type="text" id="nomePaciente" name="nomePaciente" class="form-control">
            </div>
            <div class="form-group">
              <label class="label" for="convenio">Convênio</label>
              <input type="text" id="convenio" name="convenio" class="form-control">
            </div>
            <div class="form-group">
              <label class="label" for="statusInternacao">Status Internação</label>
              <input type="text" id="statusInternacao" name="statusInternacao" class="form-control">
            </div>
          </div>
          <div class="flex">
            <button type="submit" class="btn btn-primary">Buscar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
